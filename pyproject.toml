[tool.poetry]
name = "poetry-project"
version = "0.1.0"
description = ""
authors = ["Prodeon <prodeon21gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"


[tool.poetry.group.lint.dependencies]
flake8 = "^7.3.0"
black = "^25.1.0"
mypy = "^1.17.1"
isort = "^6.0.1"


[tool.poetry.group.dev.dependencies]
pytest = "^8.4.2"
pytest-cov = "^7.0.0"
python-dotenv = "^1.1.1"
requests = "^2.32.5"
types-requests = "^2.32.4.20250913"
logging = "^0.4.9.6"
pandas = "^2.3.3"
openpyxl = "^3.1.5"
pandas-stubs = "^2.3.2.250926"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
exclude = 'venv'


[tool.isort]
line_length = 119

[tool.black]
line-length = 119
exclude = '.git'
